name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: checkpoints.json is up to date
        run: node scripts/build-index.mjs --check
      - name: validate skill package
        run: node scripts/validate.mjs
